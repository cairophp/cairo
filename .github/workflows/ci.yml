name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      mysql:
        # MariaDB: its default auth works without OpenSSL, which the
        # small PHP build leaves out.
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: cairo
        ports: ["3306:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cairo
          POSTGRES_PASSWORD: cairo
          POSTGRES_DB: cairo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cairo"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      # The libraries PHP's extensions link against (scripts/build-php.sh), needed
      # to build PHP and to run it from the cache.
      - name: Install PHP's libraries
        run: sudo apt-get update && sudo apt-get install -y libxml2-dev libsqlite3-dev libcurl4-openssl-dev libssl-dev libonig-dev libicu-dev libsodium-dev libzip-dev zlib1g-dev libbz2-dev libgmp-dev libpng-dev libjpeg-dev libwebp-dev libfreetype-dev
      - name: Cache PHP (ZTS, embed)
        id: php-cache
        uses: actions/cache@v4
        with:
          path: /opt/php-zts
          key: php-zts-8.3.27-${{ hashFiles('scripts/build-php.sh') }}
      - name: Build PHP (ZTS, embed)
        if: steps.php-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y build-essential autoconf bison re2c pkg-config
          sudo mkdir -p /opt/php-zts && sudo chown "$USER" /opt/php-zts
          scripts/build-php.sh 8.3.27 /opt/php-zts
      - name: Test
        env:
          CAIRO_TEST_MYSQL: "mysql:host=127.0.0.1;port=3306"
          CAIRO_TEST_MYSQL_USER: root
          CAIRO_TEST_MYSQL_PASSWORD: cairo
          CAIRO_TEST_PGSQL: "pgsql:host=127.0.0.1;port=5432;dbname=cairo"
          CAIRO_TEST_PGSQL_USER: cairo
          CAIRO_TEST_PGSQL_PASSWORD: cairo
        run: make test

  # One static binary (Dockerfile.static) per architecture, then the whole
  # suite against it.
  static:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    services:
      mysql:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: cairo
        ports: ["3306:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cairo
          POSTGRES_PASSWORD: cairo
          POSTGRES_DB: cairo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cairo"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: docker/setup-buildx-action@v3
      - name: Build the static binary
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.static
          outputs: type=local,dest=dist
          cache-from: type=gha,scope=static-${{ matrix.arch }}
          cache-to: type=gha,scope=static-${{ matrix.arch }},mode=max
      - name: Inspect it
        run: |
          file dist/cairo
          ls -lh dist/cairo
      - name: Test against it
        env:
          CAIRO_TEST_BIN: ${{ github.workspace }}/dist/cairo
          CAIRO_TEST_STATIC: "1"
          CAIRO_TEST_MYSQL: "mysql:host=127.0.0.1;port=3306"
          CAIRO_TEST_MYSQL_USER: root
          CAIRO_TEST_MYSQL_PASSWORD: cairo
          CAIRO_TEST_PGSQL: "pgsql:host=127.0.0.1;port=5432;dbname=cairo"
          CAIRO_TEST_PGSQL_USER: cairo
          CAIRO_TEST_PGSQL_PASSWORD: cairo
        run: go test ./test -count=1 -v
      # Kept for main only: a pull request's binary is of no use once its
      # tests have run, and every one counts against the artifact storage.
      # Tags upload theirs in release.yml.
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: cairo-linux-${{ matrix.arch }}-static
          path: dist/cairo
          retention-days: 7
