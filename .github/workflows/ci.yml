name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The suite on a native ZTS build (scripts/build-php.sh, opcache shared)
  # of each PHP that a release ships.
  test:
    name: native (${{ matrix.php }})
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(needs.versions.outputs.php) }}
    runs-on: ubuntu-24.04
    services:
      mysql:
        # MariaDB: its default auth works without OpenSSL, which the
        # small PHP build leaves out.
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: cairo
        ports: ["3306:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cairo
          POSTGRES_PASSWORD: cairo
          POSTGRES_DB: cairo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cairo"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      # The libraries PHP's extensions link against (scripts/build-php.sh), needed
      # to build PHP and to run it from the cache.
      - name: Install PHP's libraries
        run: sudo apt-get update && sudo apt-get install -y libxml2-dev libsqlite3-dev libcurl4-openssl-dev libssl-dev libonig-dev libicu-dev libsodium-dev libzip-dev zlib1g-dev libbz2-dev libgmp-dev libpng-dev libjpeg-dev libwebp-dev libfreetype-dev
      - name: Cache PHP (ZTS, embed)
        id: php-cache
        uses: actions/cache@v4
        with:
          path: /opt/php-zts
          key: php-zts-${{ matrix.php }}-${{ hashFiles('scripts/build-php.sh') }}
      - name: Build PHP (ZTS, embed)
        if: steps.php-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y build-essential autoconf bison re2c pkg-config
          sudo mkdir -p /opt/php-zts && sudo chown "$USER" /opt/php-zts
          scripts/build-php.sh "${{ matrix.php }}" /opt/php-zts
      - name: Test
        env:
          CAIRO_TEST_MYSQL: "mysql:host=127.0.0.1;port=3306"
          CAIRO_TEST_MYSQL_USER: root
          CAIRO_TEST_MYSQL_PASSWORD: cairo
          CAIRO_TEST_PGSQL: "pgsql:host=127.0.0.1;port=5432;dbname=cairo"
          CAIRO_TEST_PGSQL_USER: cairo
          CAIRO_TEST_PGSQL_PASSWORD: cairo
        run: make test

  versions:
    runs-on: ubuntu-24.04
    outputs:
      php: ${{ steps.list.outputs.php }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "php=$(jq -c . .github/php-versions.json)" >> "$GITHUB_OUTPUT"

  # The native image (Dockerfile.native) of each PHP, on the official php
  # image: an app's image adds an extension with docker-php-ext-install, and
  # Cairo loads it in the command line and in a server.
  native-image:
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(needs.versions.outputs.php) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: base
        run: echo "image=$(scripts/php-image.sh "${{ matrix.php }}")" >> "$GITHUB_OUTPUT"
      - name: Build the native image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.native
          build-args: PHP_IMAGE=${{ steps.base.outputs.image }}
          load: true
          tags: cairo-native
          cache-from: type=gha,scope=native-php${{ matrix.php }}
          cache-to: type=gha,scope=native-php${{ matrix.php }},mode=max
      - name: Add an extension to it and use it
        run: |
          minor="$(echo "${{ matrix.php }}" | cut -d. -f1,2)"
          test "$(docker run --rm --entrypoint cairo cairo-native php -r 'echo PHP_MAJOR_VERSION, ".", PHP_MINOR_VERSION, PHP_ZTS;')" = "${minor}1"
          docker build -t cairo-native-app test/native-image
          test "$(docker run --rm cairo-native-app php -r 'echo extension_loaded("shmop") ? "shmop" : "none";')" = shmop
          docker run -d --name app -p 8080:8080 cairo-native-app
          for _ in $(seq 1 50); do curl -fsS http://127.0.0.1:8080/ > answer 2>/dev/null && break; sleep 0.2; done
          docker logs app
          test "$(cat answer)" = shmop

  # A static binary with more extensions built in (Dockerfile.static's
  # PECL_EXTENSIONS and EXTRA_EXTENSIONS), for the newest PHP.
  # On PHP 8.5: no APCu release builds against 8.6 yet (5.1.28 calls the
  # php_verror() that 8.6 changed).
  static-extensions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build it with APCu (PECL) and shmop
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.static
          build-args: |
            PHP_VERSION=8.5.13
            PECL_EXTENSIONS=apcu-5.1.28
            EXTRA_EXTENSIONS=--enable-apcu --enable-shmop
          outputs: type=local,dest=dist
          cache-from: type=gha,scope=static-extensions
          cache-to: type=gha,scope=static-extensions,mode=max
      - name: Use them
        run: |
          file dist/cairo
          test "$(dist/cairo php -d apc.enable_cli=1 -r 'apcu_store("k", 42); echo apcu_fetch("k"), " ", function_exists("shmop_open") ? "shmop" : "none";')" = "42 shmop"

  # One static binary per PHP version that a release ships, architecture
  # and libc, then the whole suite against it: musl (Dockerfile.static,
  # fully static) and glibc (Dockerfile.gnu, which loads extensions: an
  # extension built with its kit is loaded in the command line and a server).
  static:
    name: static (${{ matrix.php }}, ${{ matrix.arch }}${{ matrix.libc == 'gnu' && ', gnu' || '' }})
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(needs.versions.outputs.php) }}
        arch: [amd64, arm64]
        libc: [musl, gnu]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    services:
      mysql:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: cairo
        ports: ["3306:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cairo
          POSTGRES_PASSWORD: cairo
          POSTGRES_DB: cairo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cairo"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: docker/setup-buildx-action@v3
      - name: Build the static binary
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.libc == 'gnu' && 'Dockerfile.gnu' || 'Dockerfile.static' }}
          build-args: PHP_VERSION=${{ matrix.php }}
          outputs: type=local,dest=dist
          cache-from: type=gha,scope=static-${{ matrix.libc }}-${{ matrix.arch }}-php${{ matrix.php }}
          cache-to: type=gha,scope=static-${{ matrix.libc }}-${{ matrix.arch }}-php${{ matrix.php }},mode=max
      - name: Inspect it
        run: |
          file dist/cairo
          ls -lh dist/cairo
          test "$(dist/cairo php -r 'echo PHP_VERSION;')" = "${{ matrix.php }}"
          # The newest glibc the gnu binary needs.
          if [ "${{ matrix.libc }}" = gnu ]; then objdump -T dist/cairo | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 1; fi
      - name: Build an extension with its kit and load it
        if: matrix.libc == 'gnu'
        run: |
          minor="$(echo "${{ matrix.php }}" | cut -d. -f1,2)"
          sudo tar -C / -xzf dist/cairo-dev.tar.gz
          sudo chown -R "$USER" "/opt/cairo/php$minor"
          curl -fsSL "https://github.com/php/php-src/archive/refs/tags/php-${{ matrix.php }}.tar.gz" \
            | tar -xz --strip-components=2 "php-src-php-${{ matrix.php }}/ext/shmop"
          (cd shmop && "/opt/cairo/php$minor/bin/phpize" && ./configure --with-php-config="/opt/cairo/php$minor/bin/php-config" && make && make install)
          test "$(dist/cairo php -d extension=shmop -r 'echo extension_loaded("shmop") ? "shmop" : "none";')" = shmop
          echo "extension=shmop" > ext.ini
          dist/cairo serve test/native-image/server.php --php-ini ext.ini > serve.log 2>&1 &
          pid=$!
          for _ in $(seq 1 50); do curl -fsS http://127.0.0.1:8080/ > answer 2>/dev/null && break; sleep 0.2; done
          kill "$pid"
          cat serve.log
          test "$(cat answer)" = shmop
      - name: Test against it
        env:
          CAIRO_TEST_BIN: ${{ github.workspace }}/dist/cairo
          CAIRO_TEST_STATIC: ${{ matrix.libc == 'musl' && '1' || '' }}
          CAIRO_TEST_MYSQL: "mysql:host=127.0.0.1;port=3306"
          CAIRO_TEST_MYSQL_USER: root
          CAIRO_TEST_MYSQL_PASSWORD: cairo
          CAIRO_TEST_PGSQL: "pgsql:host=127.0.0.1;port=5432;dbname=cairo"
          CAIRO_TEST_PGSQL_USER: cairo
          CAIRO_TEST_PGSQL_PASSWORD: cairo
        run: go test ./test -count=1 -v
      # Kept for main only: a pull request's binary is of no use once its
      # tests have run, and every one counts against the artifact storage.
      # Tags upload theirs in release.yml.
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: cairo-php${{ matrix.php }}-linux-${{ matrix.arch }}-${{ matrix.libc }}
          path: dist/cairo*
          retention-days: 7
