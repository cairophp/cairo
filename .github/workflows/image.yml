name: image
# Builds the official images of a published release and pushes them to
# ghcr.io/cairophp/cairo for amd64 and arm64, for each PHP version the
# release has a binary for. The static image puts the release's static binary
# on Alpine: 0.6.0-php8.4, 0.6-php8.4 and php8.4, and for the newest PHP also
# 0.6.0, 0.6 and latest. The native image builds Cairo from the tag against
# the official php image (Dockerfile.native), where an app adds extensions:
# the same tags with -trixie behind them (0.6-php8.4-trixie, and 0.6-trixie
# and trixie for the newest PHP). release.yml calls it once a release is
# public. Run it by hand only for the newest release: it moves the `latest`,
# `trixie` and `phpX.Y` tags to the release it is given.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, such as v0.5.0
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  # The PHP versions are the release's own, as its binaries name them.
  versions:
    runs-on: ubuntu-24.04
    outputs:
      php: ${{ steps.list.outputs.php }}
      newest: ${{ steps.list.outputs.newest }}
    steps:
      - id: list
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          versions="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
            | sed -n 's/^cairo-php\(.*\)-linux-amd64$/\1/p' | sort -V)"
          test -n "$versions" || { echo "release $TAG has no cairo-phpX.Y binaries" >&2; exit 1; }
          echo "php=$(echo "$versions" | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"
          echo "newest=$(echo "$versions" | tail -n 1)" >> "$GITHUB_OUTPUT"

  image:
    needs: versions
    strategy:
      matrix:
        php: ${{ fromJSON(needs.versions.outputs.php) }}
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ inputs.tag }}
      NEWEST: ${{ matrix.php == needs.versions.outputs.newest }}
    steps:
      - uses: actions/checkout@v4
      - name: Download the release's binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --pattern 'cairo-php${{ matrix.php }}-linux-*' --pattern SHA256SUMS --dir dist
          cd dist
          sha256sum --check --ignore-missing SHA256SUMS
          ls cairo-php${{ matrix.php }}-linux-amd64 cairo-php${{ matrix.php }}-linux-arm64
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # For v0.6.0 and PHP 8.4: 0.6.0-php8.4, 0.6-php8.4 and php8.4, and
      # 0.6.0, 0.6 and latest when 8.4 is the newest. A prerelease gets only
      # 0.7.0-rc.1-php8.4 (and 0.7.0-rc.1).
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/cairophp/cairo
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }},suffix=-php${{ matrix.php }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }},suffix=-php${{ matrix.php }}
            type=raw,value=php${{ matrix.php }},enable=${{ !contains(inputs.tag, '-') }}
            type=semver,pattern={{version}},value=${{ inputs.tag }},enable=${{ env.NEWEST == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }},enable=${{ env.NEWEST == 'true' }}
            type=raw,value=latest,enable=${{ env.NEWEST == 'true' && !contains(inputs.tag, '-') }}
      - uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false   # no .dockerbuild artifact, which counts against storage
        with:
          context: .
          file: Dockerfile.image
          build-args: PHP=${{ matrix.php }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Check the pushed image
        env:
          VERSION: ${{ inputs.tag }}-php${{ matrix.php }}
        run: |
          VERSION="${VERSION#v}"
          test "$(docker run --rm "ghcr.io/cairophp/cairo:$VERSION" version)" = "cairo $TAG"
          test "$(docker run --rm --entrypoint php "ghcr.io/cairophp/cairo:$VERSION" -r 'echo PHP_SAPI;')" = cli
          test "$(docker run --rm --entrypoint php "ghcr.io/cairophp/cairo:$VERSION" -r 'echo PHP_MAJOR_VERSION, ".", PHP_MINOR_VERSION;')" = "${{ matrix.php }}"


  native:
    needs: versions
    strategy:
      matrix:
        php: ${{ fromJSON(needs.versions.outputs.php) }}
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ inputs.tag }}
      NEWEST: ${{ matrix.php == needs.versions.outputs.newest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - id: base
        run: echo "image=$(scripts/php-image.sh "${{ matrix.php }}")" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/cairophp/cairo
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }},suffix=-php${{ matrix.php }}-trixie
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }},suffix=-php${{ matrix.php }}-trixie
            type=raw,value=php${{ matrix.php }}-trixie,enable=${{ !contains(inputs.tag, '-') }}
            type=semver,pattern={{version}},value=${{ inputs.tag }},suffix=-trixie,enable=${{ env.NEWEST == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }},suffix=-trixie,enable=${{ env.NEWEST == 'true' }}
            type=raw,value=trixie,enable=${{ env.NEWEST == 'true' && !contains(inputs.tag, '-') }}
      - uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: Dockerfile.native
          build-args: |
            PHP_IMAGE=${{ steps.base.outputs.image }}
            CAIRO_VERSION=${{ inputs.tag }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Check the pushed image
        env:
          VERSION: ${{ inputs.tag }}-php${{ matrix.php }}-trixie
        run: |
          VERSION="${VERSION#v}"
          test "$(docker run --rm "ghcr.io/cairophp/cairo:$VERSION" version)" = "cairo $TAG"
          test "$(docker run --rm "ghcr.io/cairophp/cairo:$VERSION" php -r 'echo PHP_MAJOR_VERSION, ".", PHP_MINOR_VERSION, PHP_ZTS;')" = "${{ matrix.php }}1"
