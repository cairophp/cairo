name: image
# Builds the official image from the static binaries of a published release
# and pushes it to ghcr.io/cairophp/cairo for amd64 and arm64. release.yml
# calls it once a release is public. Run it by hand only for the newest
# release: it moves the `latest` tag to the release it is given.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, such as v0.5.0
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Download the release's binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --pattern 'cairo-linux-*' --pattern SHA256SUMS --dir dist
          cd dist
          sha256sum --check SHA256SUMS
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # 0.5.0, 0.5 and latest for v0.5.0; only 0.6.0-rc.1 for a prerelease.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/cairophp/cairo
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }}
      - uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false   # no .dockerbuild artifact, which counts against storage
        with:
          context: .
          file: Dockerfile.image
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Check the pushed image
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          test "$(docker run --rm "ghcr.io/cairophp/cairo:$VERSION" version)" = "cairo $TAG"
          test "$(docker run --rm --entrypoint php "ghcr.io/cairophp/cairo:$VERSION" -r 'echo PHP_SAPI;')" = cli
