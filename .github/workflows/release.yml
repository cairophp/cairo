name: release
# Push a tag such as v0.1.0 to publish a GitHub release with one static
# binary per PHP version of .github/php-versions.json and architecture
# (cairo-php8.4-linux-amd64), the newest PHP's also under the plain name
# (cairo-linux-amd64), and their SHA-256 checksums. Each also has a glibc
# build that loads extensions (cairo-php8.4-linux-amd64-gnu), with the kit
# to build them (cairo-php8.4-linux-amd64-gnu-dev.tar.gz). The release notes
# are the tag's section of CHANGELOG.md. Once the release is public it
# publishes the stubs as the cairophp/stubs package under the same tag, and
# calls image.yml.
#
# Run it from the Actions page ("Run workflow" on main, with the version) to
# release without a tag push: it tags the head of main itself. A tag made
# with the workflow's token starts no workflow, so nothing runs twice.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release from the head of main, such as v0.8.1
        required: true
        type: string

permissions:
  contents: write

env:
  TAG: ${{ inputs.version || github.ref_name }}

jobs:
  # The binaries go straight onto a draft release, not through workflow
  # artifacts, so the release does not depend on the Actions storage quota.
  draft:
    runs-on: ubuntu-24.04
    steps:
      - name: Check the version
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "Run it on main, not $GITHUB_REF" >&2
            exit 1
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Not a version: $TAG (want v1.2.3 or v1.2.3-rc.1)" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Release notes from CHANGELOG.md
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            /^\[[^]]*\]: / { if (found) exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A re-run finds the draft of the first run.
          if gh release view "$TAG" >/dev/null 2>&1; then exit 0; fi
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          # A tag push names an existing tag; a run by hand makes it here,
          # at the commit every job of this run checked out.
          target="--verify-tag"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then target="--target $GITHUB_SHA"; fi
          gh release create "$TAG" --draft \
            --title "Cairo $TAG" --notes-file notes.md $target $prerelease

  versions:
    runs-on: ubuntu-24.04
    outputs:
      php: ${{ steps.list.outputs.php }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "php=$(jq -c . .github/php-versions.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: [draft, versions]
    strategy:
      matrix:
        php: ${{ fromJSON(needs.versions.outputs.php) }}
        arch: [amd64, arm64]
        libc: [musl, gnu]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      # What the binary's name ends with: nothing for musl, -gnu for glibc.
      SUFFIX: ${{ matrix.libc == 'gnu' && '-gnu' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: docker/setup-buildx-action@v3
      - name: Build the static binary
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false   # no .dockerbuild artifact, which counts against storage
        with:
          context: .
          file: ${{ matrix.libc == 'gnu' && 'Dockerfile.gnu' || 'Dockerfile.static' }}
          build-args: |
            CAIRO_VERSION=${{ env.TAG }}
            PHP_VERSION=${{ matrix.php }}
          outputs: type=local,dest=dist
          cache-from: type=gha,scope=static-${{ matrix.libc }}-${{ matrix.arch }}-php${{ matrix.php }}
      - name: Check it
        env:
          CAIRO_TEST_BIN: ${{ github.workspace }}/dist/cairo
          CAIRO_TEST_STATIC: ${{ matrix.libc == 'musl' && '1' || '' }}
        run: |
          file dist/cairo
          test "$(dist/cairo version)" = "cairo $TAG"
          test "$(dist/cairo php -r 'echo PHP_VERSION;')" = "${{ matrix.php }}"
          go test ./test -count=1 -run 'TestStaticBinary|TestPHPBuildHasOpcacheAndExtensions'
          minor="$(echo "${{ matrix.php }}" | cut -d. -f1,2)"
          name="cairo-php$minor-linux-${{ matrix.arch }}$SUFFIX"
          mv dist/cairo "dist/$name"
          if [ -e dist/cairo-dev.tar.gz ]; then mv dist/cairo-dev.tar.gz "dist/$name-dev.tar.gz"; fi
      - name: Attach it to the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/cairo-php*-linux-${{ matrix.arch }}* --clobber

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --pattern 'cairo-php*-linux-*' --dir dist --clobber
          cd dist
          # The newest PHP's binaries are also the default ones.
          newest="$(ls cairo-php*-linux-amd64 | sed 's/^cairo-php//; s/-linux-amd64$//' | sort -V | tail -n 1)"
          for arch in amd64 arm64; do
            cp "cairo-php$newest-linux-$arch" "cairo-linux-$arch"
            cp "cairo-php$newest-linux-$arch-gnu" "cairo-linux-$arch-gnu"
            cp "cairo-php$newest-linux-$arch-gnu-dev.tar.gz" "cairo-linux-$arch-gnu-dev.tar.gz"
          done
          gh release upload "$TAG" cairo-linux-amd64* cairo-linux-arm64* --clobber
          sha256sum cairo-linux-* cairo-php*-linux-* > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --draft=false

  # The stubs repository takes a push only from the org's GitHub App, whose id
  # is the variable STUBS_APP_ID and whose private key the secret
  # STUBS_APP_KEY; its token reaches cairophp/stubs alone and lasts an hour.
  stubs:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check the app
        env:
          APP_ID: ${{ vars.STUBS_APP_ID }}
          APP_KEY: ${{ secrets.STUBS_APP_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_KEY" ]; then
            echo "No STUBS_APP_ID variable or STUBS_APP_KEY secret: the stubs were not published" >&2
            exit 1
          fi
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.STUBS_APP_ID }}
          private-key: ${{ secrets.STUBS_APP_KEY }}
          owner: cairophp
          repositories: stubs
      - name: Publish the stubs
        env:
          TOKEN: ${{ steps.app.outputs.token }}
        run: |
          # The token goes in a header for this clone only, never in its URL.
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git -c http.extraheader="$auth" clone -q https://github.com/cairophp/stubs.git "$RUNNER_TEMP/stubs"
          git -C "$RUNNER_TEMP/stubs" config http.extraheader "$auth"
          # A re-run finds the tag of the first run.
          if git -C "$RUNNER_TEMP/stubs" ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "The stubs already have $TAG"
            exit 0
          fi
          git -C "$RUNNER_TEMP/stubs" config user.name "github-actions[bot]"
          git -C "$RUNNER_TEMP/stubs" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          scripts/publish-stubs.sh "$RUNNER_TEMP/stubs" "$TAG"

  image:
    needs: publish
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      tag: ${{ inputs.version || github.ref_name }}
