name: release
# Push a tag such as v0.1.0 to publish a GitHub release with one static
# binary per architecture and their SHA-256 checksums. The release notes are
# the tag's section of CHANGELOG.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # The binaries go straight onto a draft release, not through workflow
  # artifacts, so the release does not depend on the Actions storage quota.
  draft:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            /^\[[^]]*\]: / { if (found) exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A re-run finds the draft of the first run.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then exit 0; fi
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --draft \
            --title "Cairo $GITHUB_REF_NAME" --notes-file notes.md --verify-tag $prerelease

  build:
    needs: draft
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: docker/setup-buildx-action@v3
      - name: Build the static binary
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false   # no .dockerbuild artifact, which counts against storage
        with:
          context: .
          file: Dockerfile.static
          build-args: CAIRO_VERSION=${{ github.ref_name }}
          outputs: type=local,dest=dist
          cache-from: type=gha,scope=static-${{ matrix.arch }}
      - name: Check it
        env:
          CAIRO_TEST_BIN: ${{ github.workspace }}/dist/cairo
          CAIRO_TEST_STATIC: "1"
        run: |
          file dist/cairo
          test "$(dist/cairo version)" = "cairo ${{ github.ref_name }}"
          go test ./test -count=1 -run 'TestStaticBinary|TestPHPBuildHasOpcacheAndExtensions'
          mv dist/cairo dist/cairo-linux-${{ matrix.arch }}
      - name: Attach it to the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/cairo-linux-${{ matrix.arch }} --clobber

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern 'cairo-linux-*' --dir dist --clobber
          cd dist
          sha256sum cairo-linux-* > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS --clobber
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false

  image:
    needs: publish
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      tag: ${{ github.ref_name }}
