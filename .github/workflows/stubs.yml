name: stubs
# On a release tag, publish stubs/ to cairophp/stubs (the Composer package)
# under the same tag. Needs STUBS_DEPLOY_KEY: the private half of a deploy
# key with write access on cairophp/stubs.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Publish to cairophp/stubs
        env:
          STUBS_DEPLOY_KEY: ${{ secrets.STUBS_DEPLOY_KEY }}
        run: |
          if [ -z "$STUBS_DEPLOY_KEY" ]; then
            echo "STUBS_DEPLOY_KEY is not set" >&2
            exit 1
          fi
          install -m 600 /dev/null "$RUNNER_TEMP/key"
          printf '%s\n' "$STUBS_DEPLOY_KEY" > "$RUNNER_TEMP/key"
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone -q git@github.com:cairophp/stubs.git "$RUNNER_TEMP/stubs"
          git -C "$RUNNER_TEMP/stubs" config user.name "github-actions[bot]"
          git -C "$RUNNER_TEMP/stubs" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          scripts/publish-stubs.sh "$RUNNER_TEMP/stubs" "$GITHUB_REF_NAME"
