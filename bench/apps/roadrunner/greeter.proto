// The unary method of examples/greeter/proto/helloworld.proto. RoadRunner's
// gRPC plugin serves unary methods only.
syntax = "proto3";

package helloworld;

option php_namespace = "Rr\\Helloworld";
option php_metadata_namespace = "Rr\\GPBMetadata";

service Greeter {
  rpc SayHello (HelloRequest) returns (HelloReply);
}

message HelloRequest {
  string name = 1;
}

message HelloReply {
  string message = 1;
  double remaining = 2;
}
