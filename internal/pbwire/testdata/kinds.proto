// Every kind of field that pbwire converts, for its tests.
syntax = "proto3";

package kinds;

enum Color {
  option allow_alias = true;
  COLOR_UNSET = 0;
  RED = 1;
  CRIMSON = 1;
  GREEN = 2;
  BELOW = -1;
}

message Leaf {
  string name = 1;
  int32 n = 2;
}

// A map at the field number of shop.v1.Order's.
message Tagged {
  map<string, int32> tags = 3;
}

message All {
  double f_double = 1;
  float f_float = 2;
  int32 f_int32 = 3;
  int64 f_int64 = 4;
  uint32 f_uint32 = 5;
  uint64 f_uint64 = 6;
  sint32 f_sint32 = 7;
  sint64 f_sint64 = 8;
  fixed32 f_fixed32 = 9;
  fixed64 f_fixed64 = 10;
  sfixed32 f_sfixed32 = 11;
  sfixed64 f_sfixed64 = 12;
  bool f_bool = 13;
  string f_string = 14;
  bytes f_bytes = 15;
  Color f_enum = 16;
  Leaf f_msg = 17;
  All f_self = 18;

  repeated double r_double = 21;
  repeated float r_float = 22;
  repeated int32 r_int32 = 23;
  repeated int64 r_int64 = 24;
  repeated uint64 r_uint64 = 25;
  repeated sint32 r_sint32 = 26;
  repeated fixed32 r_fixed32 = 27;
  repeated sfixed64 r_sfixed64 = 28;
  repeated bool r_bool = 29;
  repeated string r_string = 30;
  repeated bytes r_bytes = 31;
  repeated Color r_enum = 32;
  repeated Leaf r_msg = 33;
  repeated int32 r_unpacked = 34 [packed = false];

  map<string, int32> m_string = 41;
  map<int32, string> m_int32 = 42;
  map<int64, Leaf> m_int64 = 43;
  map<uint64, bool> m_uint64 = 44;
  map<bool, double> m_bool = 45;
  map<sint32, Color> m_sint32 = 46;
  map<fixed64, bytes> m_fixed64 = 47;
  map<sfixed32, float> m_sfixed32 = 48;
  map<string, All> m_self = 49;

  optional int32 o_int32 = 51;
  optional string o_string = 52;
  optional Leaf o_msg = 53;
  optional double o_double = 54;
  optional Color o_enum = 55;
  optional bytes o_bytes = 56;

  oneof choice {
    int32 c_int32 = 61;
    string c_string = 62;
    Leaf c_msg = 63;
    Color c_enum = 64;
    bytes c_bytes = 65;
    double c_double = 66;
  }

  string renamed = 70 [json_name = "otherName"];
  uint32 far_number = 1000;
}

// What the end-to-end test asks PHP: whether the array it got for message
// is the one json_decode() makes of protojson's text.
message Compare {
  All message = 1;
  string json = 2;
}

message Verdict {
  bool same = 1;
  string got = 2;
}

service Kinds {
  rpc Echo (All) returns (All);
  rpc EchoEach (stream All) returns (stream All);
  rpc Check (Compare) returns (Verdict);
}
