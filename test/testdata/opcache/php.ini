; A cache that a few versions of big.php fill, and that asks for its restart
; as soon as one of them is stale.
opcache.memory_consumption=16
opcache.interned_strings_buffer=4
opcache.max_wasted_percentage=1
; A changed file is seen at once, by the second of its time.
opcache.revalidate_freq=0
opcache.file_update_protection=0
